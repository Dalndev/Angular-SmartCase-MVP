    />

      htmlFor="case-number"
    >
      Case Number
    </label>
  </ui-field>
  <ui-field>
    <ui-select
      id="case-status"
    >

    </label>

  <ui-field>
    <input
      ui-input
      id="case-alias"
    />

      ui-field-label

    >

    </label>
  </ui-field>
